# Docker Compose file for sshole-lab
services:
  # Builds the vulnerable Alpine Linux container and exposes SSH on port 2222, this one will be used as the target for the attack
  alpine-vuln:
    build:
      context: ./alpine-vuln
      network: host
    container_name: sshole-alpine-vuln
    ports:
      - "2222:22"

  # Builds the Debian control container and exposes SSH on port 2223, this one will be used to control the vulnerable container
  debian-control:
    build:
      context: ./debian-control
      network: host
    container_name: sshole-debian-control
    ports:
      - "2223:22"

  # Builds the attacker container, the one will be used to attack the vulnerable container
  attacker:
    profiles: ["attack"]
    build:
      context: ./attacker
      network: host
    container_name: sshole-attacker
